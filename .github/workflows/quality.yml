name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-analyze:
    runs-on: ubuntu-latest
    env:
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Streaming.slnx

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >-
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.sourceEncoding="UTF-8"
          /d:sonar.exclusions="**/bin/**,**/obj/**,**/wwwroot/**"
          /d:sonar.cs.opencover.reportsPaths="tests/Streaming.Tests/TestResults/coverage.opencover.xml"

      - name: Build
        run: >-
          dotnet build Streaming.slnx
          --no-restore
          --configuration Release
          /p:DebugType=portable
          /p:DebugSymbols=true

      - name: Test with coverage
        run: >-
          dotnet test tests/Streaming.Tests/Streaming.Tests.csproj
          --no-build
          --configuration Release
          /p:DebugType=portable
          /p:DebugSymbols=true
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=opencover
          /p:CoverletOutput=TestResults/coverage.opencover.xml

      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"