<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="music">Muziek</title>
<script src="/i18n.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 40rem; }
  h1 { font-size: 1.5rem; margin-top: 0; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  button { font-size: 1.25rem; padding: 1rem 1.5rem; border-radius: .75rem; border: 1px solid #8888; cursor: pointer; background: #8881; }
  button:hover { background: #8883; }
  button.active { background: #2d7d46; color: #fff; border-color: #2d7d46; }
  select, input[type=range] { font-size: 1rem; padding: .4rem; }
  #status { font-size: .95rem; opacity: .8; min-height: 1.5rem; }
  ul { padding-left: 0; list-style: none; }
  li { padding: .35rem 0; border-bottom: 1px solid #8883; display: flex; justify-content: space-between; gap: 1rem; align-items: center; }
  li button { font-size: .9rem; padding: .35rem .75rem; }
  li .title { overflow-wrap: anywhere; }
  li .title { flex: 1; }
  li button.genre { font-size: .8rem; padding: .25rem .6rem; opacity: .75; border-radius: 1rem; }
  li button.delete { line-height: 0; }
  dialog { border: 1px solid #8888; border-radius: .75rem; padding: 1.5rem; }
  dialog .row { margin-bottom: 0; }
  .genre-picker { position: relative; }
  .genre-picker summary { cursor: pointer; font-size: 1rem; padding: .4rem; border: 1px solid #8888; border-radius: .35rem; }
  .genre-options { display: grid; grid-template-columns: repeat(2, minmax(8rem, 1fr)); gap: .4rem 1rem; margin: .75rem 0; }
  .genre-options label { white-space: nowrap; }
  .genre-picker .genre-options { position: absolute; z-index: 1; padding: .75rem; border: 1px solid #8888; background: Canvas; box-shadow: 0 .25rem .75rem #0003; }
  #genreDialog { min-width: min(28rem, calc(100vw - 4rem)); }
</style>
</head>
<body>
<div style="display: flex; justify-content: space-between; align-items: center;">
  <h1 style="margin: 0;" data-i18n="music">Muziek</h1>
  <div style="display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end;">
    <a href="/schedule" data-i18n="schedule" style="color: #2d7d46; text-decoration: none; font-weight: 600; font-size: 0.95rem; border: 1px solid #2d7d46; padding: 0.35rem 0.75rem; border-radius: 0.5rem;">Schema</a>
    <a href="/report" data-i18n="report" style="color: #2d7d46; text-decoration: none; font-weight: 600; font-size: 0.95rem; border: 1px solid #2d7d46; padding: 0.35rem 0.75rem; border-radius: 0.5rem;">📊 Rapport</a>
  </div>
</div>
<div style="height: 1.25rem;"></div>

<div class="row">
  <label><span data-i18n="speaker">Speaker</span>
    <select id="speaker"></select>
  </label>
</div>

<div class="row">
  <button id="btnStart" class="active" onclick="post('/api/play', 'shuffle=' + $('shuffle').checked)" data-i18n="start">Start</button>
  <button id="btnPause" onclick="post('/api/pause')" data-i18n="pause">Pauze</button>
  <button id="btnStop" onclick="post('/api/stop')" data-i18n="stop">Stop</button>
  <button onclick="post('/api/next')" data-i18n="next">Volgende</button>
  <button id="btnUpload" data-i18n="upload">Upload</button>
</div>

<dialog id="uploadDialog">
  <form method="dialog">
    <h2 data-i18n="uploadMusic">Muziek uploaden</h2>
    <div class="row">
      <label><span data-i18n="invoiceOptional">Aankoopbewijs (optioneel)</span> <input type="file" id="invoiceFile" accept="application/pdf,image/*"></label>
    </div>
    <div class="row">
      <label><span data-i18n="genresUpload">Genres (optioneel, gelden voor alle geselecteerde bestanden)</span>
        <details class="genre-picker">
          <summary id="uploadGenreSummary" data-i18n="noGenreChosen">Geen genre gekozen</summary>
          <div class="genre-options" id="uploadGenreOptions"></div>
        </details>
      </label>
    </div>
    <div class="row">
      <input type="file" id="uploadFiles" accept="audio/*" multiple>
    </div>
    <div id="licenseFiles"></div>
    <div class="row">
      <button value="cancel" data-i18n="cancel">Annuleren</button>
      <button value="upload" id="btnDoUpload" data-i18n="doUpload">Uploaden</button>
    </div>
  </form>
</dialog>

<dialog id="genreDialog">
  <form method="dialog">
    <h2 data-i18n="editGenres">Genres aanpassen</h2>
    <p id="genreTrackTitle"></p>
    <div class="genre-options" id="editGenreOptions"></div>
    <div class="row">
      <button value="cancel" data-i18n="cancel">Annuleren</button>
      <button value="save" data-i18n="save">Opslaan</button>
    </div>
  </form>
</dialog>

<div class="row">
  <label><input type="checkbox" id="shuffle"> <span data-i18n="shuffle">Willekeurige volgorde</span></label>
</div>

<div class="row">
  <label><span data-i18n="volume">Volume</span> <input type="range" id="volume" min="0" max="100" value="25"></label>
</div>

<p id="status"></p>
<p id="nowPlaying"></p>

<h2 data-i18n="tracksHeading">Nummers</h2>
<ul id="tracks"></ul>

<script>
const $ = id => document.getElementById(id);
const say = text => $('status').textContent = text;
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const genres = ['Blues', 'Relax' ,'Country', 'Dance', 'Elektronisch', 'Folk', 'Funk', 'Hip-hop', 'Jazz', 'Klassiek', 'Latin', 'Metal', 'Pop', 'Reggae', 'Rock', 'Soul', 'Wereldmuziek'];

function genreValues(value) {
  return value && value !== 'onbekend' ? value.split(',').map(item => item.trim()).filter(Boolean) : [];
}

function renderGenreOptions(container, selected = []) {
  const values = [...genres, ...selected.filter(value => !genres.includes(value))];
  container.replaceChildren(...values.map(value => {
    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.value = value;
    checkbox.checked = selected.includes(value);
    label.append(checkbox, ' ' + genreLabel(value));
    return label;
  }));
}

function selectedGenres(container) {
  return [...container.querySelectorAll('input:checked')].map(input => input.value).join(', ');
}

function updateUploadGenreSummary() {
  $('uploadGenreSummary').textContent = genreListLabel(selectedGenres($('uploadGenreOptions'))) || t('noGenreChosen');
}

// The token is kept in localStorage; on a 401 we ask once and retry.
async function api(path, options = {}) {
  const send = () => {
    const token = localStorage.getItem('apiToken');
    return fetch(path, { ...options, headers: { ...options.headers, ...(token ? { 'X-Api-Token': token } : {}) } });
  };

  const res = await send();
  if (res.status !== 401) return res;

  const token = prompt(t('accessPrompt'));
  if (!token) return res;
  localStorage.setItem('apiToken', token);
  return send();
}

function speakerParam(extra = '') {
  const name = $('speaker').value;
  const params = new URLSearchParams(extra);
  if (name) params.set('speaker', name);
  const query = params.toString();
  return query ? '?' + query : '';
}

async function post(path, extra = '') {
  say(t('busy'));
  try {
    const res = await api(path + speakerParam(extra), { method: 'POST' });
    const data = await res.json();
    say(res.ok ? (data.tracks ? t('trackCount', { n: data.tracks }) : t('ok')) : data.error);
  } catch (err) {
    say(t('error') + err.message);
  }
  refreshState();
}

function setActive(state) {
  const map = { PLAYING: 'btnStart', PAUSED_PLAYBACK: 'btnPause', STOPPED: 'btnStop' };
  const activeId = map[state] ?? 'btnStop';
  for (const id of ['btnStart', 'btnPause', 'btnStop']) $(id).classList.toggle('active', id === activeId);
}

function formatTime(totalSeconds) {
  const s = Math.max(0, Math.round(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  const mm = String(m).padStart(h > 0 ? 2 : 1, '0');
  const ss = String(sec).padStart(2, '0');
  return h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`;
}

let playback = null; // { title, elapsed, duration, playing } — elapsed keeps ticking locally between polls

function renderPlayback() {
  $('nowPlaying').textContent = playback?.title
    ? `${playback.title} — ${formatTime(playback.elapsed)} / ${formatTime(playback.duration)}`
    : '';
}

async function refreshState() {
  try {
    const res = await api('/api/state' + speakerParam());
    if (!res.ok) return;
    const data = await res.json();
    setActive(data.state);
    playback = data.title
      ? { title: data.title, elapsed: data.elapsed, duration: data.duration, playing: data.state === 'PLAYING' }
      : null;
    renderPlayback();
  } catch { /* speaker unreachable, leave the buttons as they are */ }
}

async function load() {
  const speakers = await (await api('/api/speakers')).json();
  $('speaker').innerHTML = speakers.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('')
    || `<option value="">${t('noSpeakerFound')}</option>`;

  await loadTracks();
  refreshState();
}

const crossIcon = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1 13 13M13 1 1 13" stroke="currentColor" stroke-width="2" fill="none"/></svg>';

async function loadTracks() {
  const tracks = await (await api('/api/tracks')).json();
  const list = $('tracks');
  list.innerHTML = '';
  for (const track of tracks) {
    const li = document.createElement('li');
    const title = document.createElement('span');
    title.className = 'title';
    title.textContent = track.title;
    const genre = document.createElement('button');
    genre.className = 'genre';
    genre.title = t('editGenre');
    genre.textContent = genreListLabel(track.genre);
    genre.onclick = () => editGenre(track);
    const del = document.createElement('button');
    del.className = 'delete';
    del.title = t('remove');
    del.setAttribute('aria-label', t('removeTrack', { title: track.title }));
    del.innerHTML = crossIcon;
    del.onclick = () => removeTrack(track);
    li.append(title, genre, del);
    list.append(li);
  }
}

async function editGenre(track) {
  $('genreTrackTitle').textContent = track.title;
  renderGenreOptions($('editGenreOptions'), genreValues(track.genre));
  $('genreDialog').dataset.trackPath = track.path;
  $('genreDialog').showModal();
}

async function saveGenre(path) {
  const value = selectedGenres($('editGenreOptions'));
  say(t('busy'));
  try {
    const res = await api('/api/tracks/genre', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, genre: value })
    });
    if (!res.ok) { say((await res.json()).error); return; }
    say(t('genreSaved'));
  } catch (err) {
    say(t('error') + err.message);
    return;
  }
  await loadTracks();
}

// Reload after upload/delete; if the removed track was playing, start the first available file.
async function refreshAfterChange(resumePlaying) {
  await loadTracks();
  if (resumePlaying) await post('/api/play', 'shuffle=' + $('shuffle').checked);
  else refreshState();
}

async function removeTrack(track) {
  if (!confirm(t('confirmDelete'))) return;

  const isCurrent = playback?.title === track.title;
  const wasPlaying = playback?.playing === true;
  if (isCurrent) await post('/api/stop');

  say(t('busy'));
  try {
    const path = track.path.split('/').map(encodeURIComponent).join('/');
    const res = await api('/api/tracks/' + path, { method: 'DELETE' });
    const data = await res.json();
    say(res.ok ? t('deleted') : data.error);
    if (!res.ok) return;
  } catch (err) {
    say(t('error') + err.message);
    return;
  }
  await refreshAfterChange(isCurrent && wasPlaying);
}

async function uploadFiles() {
  const input = $('uploadFiles');
  const files = [...input.files].filter(f => f.type.startsWith('audio/'));
  if (files.length === 0) { say(t('noAudioSelected')); return; }

  const body = new FormData();
  for (const file of files) body.append('files', file);
  const invoice = $('invoiceFile').files[0];
  if (invoice) body.append('invoice', invoice);
  const genre = selectedGenres($('uploadGenreOptions'));
  if (genre) body.append('genre', genre);
  for (const file of files) {
    const license = document.querySelector(`[data-license-for="${CSS.escape(file.name)}"]`)?.files[0];
    if (license) body.append('license:' + file.name, license);
  }
  input.value = '';
  $('invoiceFile').value = '';
  renderGenreOptions($('uploadGenreOptions'));
  updateUploadGenreSummary();
  $('licenseFiles').replaceChildren();

  say(t('uploading'));
  try {
    const res = await api('/api/tracks', { method: 'POST', body });
    const data = await res.json();
    if (!res.ok) { say(data.error); return; }

    let msg = t('uploadResult', { saved: data.saved.length, skipped: data.skipped.length });
    if (data.flagged.length > 0)
      msg += t('flaggedCopyright') + data.flagged.join('; ');
    say(msg);
  } catch (err) {
    say(t('error') + err.message);
    return;
  }
  await refreshAfterChange(false);
}

renderGenreOptions($('uploadGenreOptions'));
$('uploadGenreOptions').onchange = updateUploadGenreSummary;
$('btnUpload').onclick = () => $('uploadDialog').showModal();
$('uploadFiles').onchange = e => {
  const licenses = $('licenseFiles');
  licenses.replaceChildren();
  for (const file of e.target.files) {
    if (!file.type.startsWith('audio/')) continue;
    const label = document.createElement('label');
    label.textContent = t('licenseFor', { name: file.name });
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,image/*,.txt';
    input.dataset.licenseFor = file.name;
    label.append(input);
    licenses.append(label);
  }
};
$('uploadDialog').addEventListener('close', e => {
  if (e.target.returnValue === 'upload') uploadFiles();
  else {
    $('uploadFiles').value = '';
    $('invoiceFile').value = '';
    renderGenreOptions($('uploadGenreOptions'));
    updateUploadGenreSummary();
    $('licenseFiles').replaceChildren();
  }
});
$('genreDialog').addEventListener('close', e => {
  if (e.target.returnValue === 'save') saveGenre(e.target.dataset.trackPath);
});
$('volume').onchange = e => post('/api/volume', 'level=' + e.target.value);
$('speaker').onchange = refreshState;
load();
setInterval(refreshState, 10000);
setInterval(() => {
  if (!playback?.playing) return;
  playback.elapsed = Math.min(playback.elapsed + 1, playback.duration);
  renderPlayback();
}, 1000);
</script>
</body>
</html>
