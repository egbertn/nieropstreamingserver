<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="music">Muziek</title>
<script src="/i18n.js"></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 65rem; }
  h1 { font-size: 1.5rem; margin-top: 0; }
  .row { display: flex; gap: .75rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  button { font-size: 1.25rem; padding: 1rem 1.5rem; border-radius: .75rem; border: 1px solid #8888; cursor: pointer; background: #8881; }
  button:hover { background: #8883; }
  button.active { background: #2d7d46; color: #fff; border-color: #2d7d46; }
  select, input[type=range], input[type=search] { font-size: 1rem; padding: .4rem; }
  #status { font-size: .95rem; opacity: .8; min-height: 1.5rem; }
  .track-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  .track-table th, .track-table td { text-align: left; padding: .6rem .4rem; border-bottom: 1px solid #8883; overflow-wrap: anywhere; }
  .track-table th:last-child, .track-table td:last-child { width: 3rem; text-align: right; }
  .track-table button { font-size: .9rem; padding: .35rem .6rem; }
  .track-table button.genre { border-radius: 1rem; }
  .track-table button.delete { line-height: 0; }
  .pagination { align-items: center; margin-top: 1rem; }
  .pagination button { font-size: 1rem; padding: .4rem .8rem; }
  dialog { border: 1px solid #8888; border-radius: .75rem; padding: 1.5rem; }
  dialog .row { margin-bottom: 0; }
  .genre-picker { position: relative; }
  .genre-picker summary { cursor: pointer; font-size: 1rem; padding: .4rem; border: 1px solid #8888; border-radius: .35rem; }
  .genre-options { display: grid; grid-template-columns: repeat(2, minmax(8rem, 1fr)); gap: .4rem 1rem; margin: .75rem 0; }
  .genre-options label { white-space: nowrap; }
  .genre-picker .genre-options { position: absolute; z-index: 1; padding: .75rem; border: 1px solid #8888; background: Canvas; box-shadow: 0 .25rem .75rem #0003; }
  #genreDialog { min-width: min(28rem, calc(100vw - 4rem)); }
  #uploadLock { position: fixed; inset: 0; background: #0006; z-index: 1000; display: none; }
  body.uploading #uploadLock { display: block; }
  #btnUpload { position: relative; overflow: hidden; }
  body.uploading #btnUpload { z-index: 1001; cursor: progress; background: linear-gradient(90deg, #2d7d46 var(--progress, 0%), #8881 var(--progress, 0%)); }
  #btnUpload.indeterminate { background: repeating-linear-gradient(90deg, #2d7d4666 0 1rem, #8881 1rem 2rem); }
</style>
</head>
<body>
<div id="uploadLock"></div>
<div style="display: flex; justify-content: space-between; align-items: center;">
  <h1 style="margin: 0;" data-i18n="music">Muziek</h1>
  <div style="display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-end;">
    <a href="/schedule" data-i18n="schedule" style="color: #2d7d46; text-decoration: none; font-weight: 600; font-size: 0.95rem; border: 1px solid #2d7d46; padding: 0.35rem 0.75rem; border-radius: 0.5rem;">Schema</a>
    <a href="/report" data-i18n="report" style="color: #2d7d46; text-decoration: none; font-weight: 600; font-size: 0.95rem; border: 1px solid #2d7d46; padding: 0.35rem 0.75rem; border-radius: 0.5rem;">📊 Rapport</a>
  </div>
</div>
<div style="height: 1.25rem;"></div>

<div class="row">
  <label><span data-i18n="speaker">Speaker</span>
    <select id="speaker"></select>
  </label>
</div>

<div class="row">
  <button id="btnStart" data-i18n="start">Start</button>
  <button id="btnPause" onclick="post('/api/pause')" data-i18n="pause">Pauze</button>
  <button id="btnStop" onclick="post('/api/stop')" data-i18n="stop">Stop</button>
  <button onclick="post('/api/next')" data-i18n="next">Volgende</button>
  <button id="btnUpload" data-i18n="upload">Upload</button>
</div>

<dialog id="uploadDialog">
  <form method="dialog">
    <h2 data-i18n="uploadMusic">Muziek uploaden</h2>
    <div class="row">
      <label><span data-i18n="invoiceOptional">Aankoopbewijs (optioneel)</span> <input type="file" id="invoiceFile" accept="application/pdf,image/*"></label>
    </div>
    <div class="row">
      <label><span data-i18n="genresUpload">Genres (optioneel, gelden voor alle geselecteerde bestanden)</span>
        <details class="genre-picker">
          <summary id="uploadGenreSummary" data-i18n="noGenreChosen">Geen genre gekozen</summary>
          <div class="genre-options" id="uploadGenreOptions"></div>
        </details>
      </label>
    </div>
    <div class="row">
      <input type="file" id="uploadFiles" accept=".mp3,.m4a,.flac,.wav,.ogg,.mp4,.wmv" multiple>
      <span data-i18n="uploadFormats">MP3, M4A, FLAC, WAV, OGG, MP4 en WMV worden omgezet naar MP3 met genormaliseerde luidheid.</span>
    </div>
    <div id="licenseFiles"></div>
    <div class="row">
      <button value="cancel" data-i18n="cancel">Annuleren</button>
      <button value="upload" id="btnDoUpload" data-i18n="doUpload">Uploaden</button>
    </div>
  </form>
</dialog>

<dialog id="genreDialog">
  <form method="dialog">
    <h2 data-i18n="editGenres">Genres aanpassen</h2>
    <p id="genreTrackTitle"></p>
    <div class="genre-options" id="editGenreOptions"></div>
    <div class="row">
      <button value="cancel" data-i18n="cancel">Annuleren</button>
      <button value="save" data-i18n="save">Opslaan</button>
    </div>
  </form>
</dialog>

<div class="row">
  <label><span data-i18n="playMode">Afspeelmodus</span>
    <select id="playMode">
      <option value="all" data-i18n="playAll">Alles zonder schema</option>
      <option value="schedule" data-i18n="playSchedule">Speel schema</option>
      <option value="selection" data-i18n="playSelection">Speel selectie</option>
    </select>
  </label>
  <label><input type="checkbox" id="shuffle"> <span data-i18n="shuffle">Willekeurige volgorde</span></label>
</div>

<div class="row">
  <label><span data-i18n="volume">Volume</span> <input type="range" id="volume" min="0" max="100" value="25"></label>
</div>

<p id="status"></p>
<p id="nowPlaying"></p>

<h2 data-i18n="tracksHeading">Nummers</h2>
<div class="row">
  <label><span data-i18n="searchName">Zoek op naam</span> <input type="search" id="searchName"></label>
  <label><span data-i18n="searchGenre">Zoek op genre</span> <input type="search" id="searchGenre"></label>
</div>
<p id="selectionInfo" aria-live="polite"></p>
<table class="track-table">
  <thead><tr><th scope="col" data-i18n="name">Naam</th><th scope="col" data-i18n="genresLabel">Genres</th><th scope="col" data-i18n="actions">Acties</th></tr></thead>
  <tbody id="tracks"></tbody>
</table>
<div class="row pagination">
  <button id="pagePrevious" data-i18n="previousPage">Vorige</button>
  <span id="pageInfo" aria-live="polite"></span>
  <button id="pageNext" data-i18n="nextPage">Volgende</button>
</div>

<div id="appVersion" style="position: fixed; left: .5rem; bottom: .25rem; font-size: .75rem; opacity: .6;"></div>
<script src="/index.js"></script>
</body>
</html>
